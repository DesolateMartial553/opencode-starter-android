# The tap menu. Opened by the MENU button, the MENU extra key, or Ctrl-b then Space.
# Tap an item, or press the letter shown for it.
display-menu -T "#[align=centre,bold] OpenCode menu " -x C -y C \
  "New window"                       c "new-window -c '#{pane_current_path}'" \
  "Next window"                      n "next-window" \
  "Previous window"                  p "previous-window" \
  "All windows (pick one)"           w "choose-tree -Zw" \
  "" \
  "Split: top / bottom"              - "split-window -v -c '#{pane_current_path}'" \
  "Split: left / right"              | "split-window -h -c '#{pane_current_path}'" \
  "Full-screen this pane (toggle)"   z "resize-pane -Z" \
  "Scroll back (swipe; q exits)"     s "copy-mode" \
  "" \
  "Rename this window"               r "command-prompt -I '#W' -p 'Window name:' 'rename-window -- \"%%\"'" \
  "Close this pane"                  x "confirm-before -p 'Close this pane? (y/n)' kill-pane" \
  "" \
  "LEAVE (keeps OpenCode running)"   d "detach-client" \
  "Help / cheat sheet"               h "display-popup -E -w 95% -h 90% 'less -R ~/.tmux-help.txt'" \
  "STOP everything"                  Q "confirm-before -p 'Stop OpenCode and close tmux? (y/n)' kill-session"
