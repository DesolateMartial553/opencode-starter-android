# Phone-friendly tmux config installed by the OpenCode Android starter kit
set -g mouse on                      # swipe to scroll, tap to select panes
set -g history-limit 50000
set -sg escape-time 10               # keep Esc snappy inside OpenCode
set -g focus-events on
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"   # true colour
set -g base-index 1
set -g renumber-windows on
set -g status-interval 10
set -g status-left "[#S] "
set -g status-right "%H:%M"
set -g status-style "bg=colour236,fg=colour250"
# prefix stays Ctrl-b: tap CTRL on the extra-keys row, then b
