# Phone-friendly tmux config installed by the OpenCode Android starter kit
# Everything important is a TAP: the bar at the top has buttons, and the menu lists every action.

# --- behaviour ---------------------------------------------------------------------------------
set -g mouse on                      # tap panes/windows/buttons, swipe to scroll
set -g history-limit 50000
set -sg escape-time 10               # keep Esc snappy inside OpenCode
set -g focus-events on
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"   # true colour
set -g base-index 1
set -g renumber-windows on
set -g display-time 3000             # messages stay 3 seconds
set -g allow-rename off              # keep window names readable
# prefix stays Ctrl-b: tap CTRL on the extra-keys row, then b. Or just tap MENU (no prefix needed).

# --- the bar (top, so the phone keyboard never covers it) --------------------------------------
set -g status on
set -g status-position top
set -g status-interval 10
set -g status-justify left
set -g status-style "bg=colour235,fg=colour250"
set -g status-left-length 20
set -g status-right-length 40
# [ ≡ MENU ]  1:OpenCode  2:shell                               [ + NEW ] [ LEAVE ]  12:30
set -g status-left  "#[range=user|menu,bg=colour39,fg=colour16,bold] ≡ MENU #[norange,default] "
set -g window-status-format         "#[range=window|#{window_index}] #I:#W "
set -g window-status-current-format "#[range=window|#{window_index},bg=colour238,fg=colour39,bold] #I:#W "
set -g window-status-separator ""
set -g status-right "#[range=user|new,bg=colour71,fg=colour16,bold] + NEW #[norange,default] #[range=user|leave,bg=colour166,fg=colour16,bold] LEAVE #[norange,default] #[fg=colour245]%H:%M "
set -g message-style "bg=colour39,fg=colour16,bold"
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour39"
set -g mode-style "bg=colour39,fg=colour16"          # selection / scroll mode highlight
set -gq menu-style "bg=colour235,fg=colour252"
set -gq menu-selected-style "bg=colour39,fg=colour16,bold"
set -gq menu-border-style "fg=colour39"

# --- taps on the bar ---------------------------------------------------------------------------
# Anything tapped on the bar is handed to tmux-tap, which knows about the three buttons and the window
# tabs. (An earlier version tried to do it all in one nested tmux "if" and window switching silently failed.)
bind -n MouseDown1Status run-shell -b 'tmux-tap "#{mouse_status_range}"'

# --- keys (all optional: the menu does the same things) ----------------------------------------
bind Space source-file ~/.tmux-menu.conf          # Ctrl-b then Space = the menu (also the MENU key in Termux)
bind ? display-popup -E -w 95% -h 90% "less -R ~/.tmux-help.txt"
bind | split-window -h -c "#{pane_current_path}"  # easier to remember than % and "
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -n OpenCode 'oc-pane || exec bash'   # a new window starts another OpenCode, not a bare shell
bind r source-file ~/.tmux.conf \; display-message "tmux settings reloaded"
set-hook -g client-attached 'display-message "Tap ≡ MENU (top left) for everything. LEAVE keeps it running."'
